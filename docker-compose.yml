name: nice-almaty

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nice}
      POSTGRES_DB: ${POSTGRES_DB:-nice_almaty}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nice} -d ${POSTGRES_DB:-nice_almaty}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Одноразовый прогон миграций: приложение стартует только после него.
  migrate:
    build:
      context: .
      target: tooling
    command: pnpm db:migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nice}:${POSTGRES_PASSWORD:-nice}@postgres:5432/${POSTGRES_DB:-nice_almaty}
      DIRECT_DATABASE_URL: ''
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEPLOY_TARGET: docker
      DATABASE_URL: postgres://${POSTGRES_USER:-nice}:${POSTGRES_PASSWORD:-nice}@postgres:5432/${POSTGRES_DB:-nice_almaty}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOCAL_STORAGE_PATH: /app/storage
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - storage-data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Планировщик для режима Docker. Заданий пока нет: они появятся в фазе 6.
  worker:
    build:
      context: .
      target: tooling
    command: pnpm worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEPLOY_TARGET: docker
      DATABASE_URL: postgres://${POSTGRES_USER:-nice}:${POSTGRES_PASSWORD:-nice}@postgres:5432/${POSTGRES_DB:-nice_almaty}
      APP_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:

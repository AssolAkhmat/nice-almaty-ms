name: nice-almaty

# Строка подключения одна на три сервиса: миграции, приложение и планировщик
# обязаны смотреть в одну базу, а три копии строки однажды разойдутся.
# Запасного значения у пароля нет (CLAUDE.md §5): пустая переменная молча
# вернула бы общеизвестный пароль. Нет значения — compose останавливается.
x-database-url: &database-url postgres://${POSTGRES_USER:-nice}:${POSTGRES_PASSWORD:?пароль роли базы из POSTGRES_USER, по умолчанию nice, задайте POSTGRES_PASSWORD в .env}@postgres:5432/${POSTGRES_DB:-nice_almaty}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nice}
      # Пароль без запасного значения — как у остальных секретов (CLAUDE.md §5).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?пароль роли базы из POSTGRES_USER, по умолчанию nice, задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-nice_almaty}
    # Только на петлевом интерфейсе: на VPS с публичным адресом `5432:5432`
    # открывает базу с паролем из .env всему интернету, и ufw этого не видит —
    # Docker пишет свои правила iptables в обход него. Команды `db:*` с хоста
    # и `pnpm test:db` ходят через localhost, им этого достаточно.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nice} -d ${POSTGRES_DB:-nice_almaty}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Одноразовый прогон миграций: приложение стартует только после него.
  migrate:
    build:
      context: .
      target: tooling
    # Хост `postgres` — не localhost, поэтому цель подтверждается явно
    # (CLAUDE.md §5): страж пропускает только тот хост, который назван в команде.
    command: pnpm db:migrate --allow-remote=postgres
    env_file:
      - .env
    environment:
      DATABASE_URL: *database-url
      DIRECT_DATABASE_URL: ''
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    # PID 1 — tini, а не node: процессы chromium, осиротевшие после печати,
    # переходят к PID 1, и node их не подбирает — каждый договор оставлял
    # по четыре зомби до перезапуска контейнера.
    init: true
    env_file:
      - .env
    environment:
      DEPLOY_TARGET: docker
      DATABASE_URL: *database-url
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOCAL_STORAGE_PATH: /app/storage
      # Пустой `CHROMIUM_PATH=` из .env через env_file перекрывает ENV образа,
      # а puppeteer-core сам браузер не ищет — договор не печатался бы вовсе.
      # `:-` подставляет путь из Dockerfile и для пустого значения, и для отсутствующего.
      CHROMIUM_PATH: ${CHROMIUM_PATH:-/usr/bin/chromium-browser}
    # Только на петлевом интерфейсе: снаружи приложение доступно через caddy,
    # который держит TLS. Публикация на все адреса отдавала бы то же самое
    # по голому HTTP в обход сертификата — и cookie сессии с флагом Secure
    # там всё равно не встанет.
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      - storage-data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Планировщик для режима Docker. Заданий пока нет: они появятся в фазе 6.
  worker:
    build:
      context: .
      target: tooling
    command: pnpm worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEPLOY_TARGET: docker
      DATABASE_URL: *database-url
      APP_URL: http://app:3000
    depends_on:
      app:
        condition: service_healthy

  # Единственная дверь снаружи: TLS, продление сертификата, проксирование.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?домен приложения, например nice.aqy.kz, задайте APP_DOMAIN в .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты и ключи ACME переживают пересоздание контейнера:
      # без тома каждый перезапуск просил бы у Let's Encrypt новый сертификат
      # и упёрся бы в недельный предел выдач на домен.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      # Намеренно `started`, а не `healthy`: прокси обязан подняться и держать
      # сертификат даже тогда, когда приложение лежит, иначе отвалится и TLS.
      app:
        condition: service_started

volumes:
  postgres-data:
  storage-data:
  caddy-data:
  caddy-config:

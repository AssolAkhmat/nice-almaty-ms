name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Тестовые, не секретные значения: escape-hatch вида SKIP_ENV_VALIDATION
  # мы намеренно не заводим (docs/08-DECISIONS.md, P0-6).
  DEPLOY_TARGET: docker
  DATABASE_URL: postgres://nice:nice@localhost:5432/nice_almaty
  APP_URL: http://localhost:3000
  SESSION_SECRET: ci-session-secret-not-a-real-secret-32ch
  FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  CRON_SECRET: ci-cron-secret-16ch
  STORAGE_DRIVER: local
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Проверки и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm verify
        run: pnpm verify

      - name: Сборка под Docker
        run: pnpm build

      - name: Сборка под Vercel
        run: pnpm build
        env:
          DEPLOY_TARGET: vercel

  database:
    name: Миграции и интеграционные тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nice
          POSTGRES_PASSWORD: nice
          POSTGRES_DB: nice_almaty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nice -d nice_almaty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Применение миграций
        run: pnpm db:migrate

      - name: Повторный прогон ничего не дублирует
        run: pnpm db:migrate

      - name: Расширение btree_gist установлено
        run: |
          PGPASSWORD=nice psql -h localhost -U nice -d nice_almaty \
            -tAc "select extname from pg_extension where extname = 'btree_gist'" | grep -q btree_gist

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Установка браузера
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      - run: pnpm test:e2e

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
